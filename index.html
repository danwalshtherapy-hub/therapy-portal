<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Therapy Portal Login</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Inter", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1d3b40;
      position: relative;
      overflow: hidden;
    }

    /* Botanical SVG background */
    .botanical-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Login card */
    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 16px;
      width: 320px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      animation: fadeIn 0.8s ease;
      color: white;
      text-align: center; /* Center everything */
    }

    h2 {
      margin-top: 0;
      font-weight: 600;
    }

    input {
      width: 100%;
      max-width: 240px;   /* ← change this number to adjust input width */
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      margin: 12px auto;
      display: block;
    }
    
    button {
      width: 100%;
      max-width: 260px;   /* ← button can be wider or same as input */
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      margin: 12px auto;
      display: block;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }
      
    button:hover {
      background: #45a049;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <!-- Botanical background -->
  <svg class="botanical-bg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Monstera leaf (fill-rule evenodd cuts fenestration holes) -->
      <path id="monstera" fill-rule="evenodd" d="
        M 0,0
        C 55,-15 95,-45 100,-85 C 105,-125 55,-138 28,-148
        C 72,-158 105,-180 100,-212 C 95,-244 48,-255 22,-265
        C 52,-282 68,-304 52,-332 C 36,-358 18,-366 0,-370
        C -18,-366 -36,-358 -52,-332 C -68,-304 -52,-282 -22,-265
        C -48,-255 -95,-244 -100,-212 C -105,-180 -72,-158 -28,-148
        C -55,-138 -105,-125 -100,-85 C -95,-45 -55,-15 0,0 Z
        M 52,-108 A 22,16 0 1,0 52.1,-108 Z
        M -52,-108 A 22,16 0 1,0 -52.1,-108 Z
        M 34,-218 A 18,13 0 1,0 34.1,-218 Z
        M -34,-218 A 18,13 0 1,0 -34.1,-218 Z
      "/>
      <!-- Palm frond leaf — single elongated blade -->
      <path id="palm-blade" d="M 0,0 C 8,-40 10,-90 4,-140 C 2,-160 -2,-160 -4,-140 C -10,-90 -8,-40 0,0 Z"/>
    </defs>

    <!-- Monstera leaves -->
    <use href="#monstera" transform="translate(140,820) scale(1.6)"               fill="rgba(255,255,255,0.18)"/>
    <use href="#monstera" transform="translate(60,700)  scale(1.0)"               fill="rgba(255,255,255,0.12)"/>
    <use href="#monstera" transform="translate(1080,800) scale(1.4) scale(-1,1)"  fill="rgba(255,255,255,0.18)"/>
    <use href="#monstera" transform="translate(1160,660) scale(0.9) scale(-1,1)"  fill="rgba(255,255,255,0.11)"/>
    <use href="#monstera" transform="translate(600,850) scale(0.8)"               fill="rgba(255,255,255,0.08)"/>

    <!-- Palm fronds — bottom left cluster -->
    <g transform="translate(30,820)" fill="rgba(255,255,255,0.20)">
      <use href="#palm-blade" transform="rotate(-50) scale(1,2.6)"/>
      <use href="#palm-blade" transform="rotate(-35) scale(1,3.0)"/>
      <use href="#palm-blade" transform="rotate(-20) scale(1,3.3)"/>
      <use href="#palm-blade" transform="rotate(-5)  scale(1,3.1)"/>
      <use href="#palm-blade" transform="rotate(12)  scale(1,2.7)"/>
    </g>

    <!-- Palm fronds — bottom right cluster -->
    <g transform="translate(1170,820)" fill="rgba(255,255,255,0.20)">
      <use href="#palm-blade" transform="rotate(50)  scale(1,2.6)"/>
      <use href="#palm-blade" transform="rotate(35)  scale(1,3.0)"/>
      <use href="#palm-blade" transform="rotate(20)  scale(1,3.3)"/>
      <use href="#palm-blade" transform="rotate(5)   scale(1,3.1)"/>
      <use href="#palm-blade" transform="rotate(-12) scale(1,2.7)"/>
    </g>

    <!-- Top corner accents -->
    <use href="#monstera" transform="translate(0,180) scale(0.75) rotate(30)"              fill="rgba(255,255,255,0.10)"/>
    <use href="#monstera" transform="translate(1200,160) scale(0.75) rotate(-30) scale(-1,1)" fill="rgba(255,255,255,0.10)"/>
  </svg>

  <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:20px;">

    <div class="card">
      <h2>Welcome Back</h2>
      <p style="opacity:0.8;">Sign in to continue</p>

      <input id="email" type="email" placeholder="Email address" />
      <button onclick="login()">Send Login Link</button>

      <div id="message"></div>
    </div>

  </div>

  <script>
    const { createClient } = supabase;
    const supabaseClient = createClient(
      "https://crdfeaktmahbzwlontup.supabase.co",
      "sb_publishable_cjevTmosz1gAE_zXRt81CQ_Laq35vIZ"
    );

    const THERAPIST_EMAIL = "johnrobertcarrahar@gmail.com";

    async function login() {
      const email = document.getElementById("email").value.trim();
      const msg = document.getElementById("message");

      if (!email) {
        msg.innerHTML = "<span style='color:#ffb3b3'>Please enter your email address.</span>";
        return;
      }

      msg.innerHTML = "Sending magic link...";

      const { error } = await supabaseClient.auth.signInWithOtp({ email });

      if (error) {
        msg.innerHTML = "<span style='color:#ffb3b3'>" + error.message + "</span>";
      } else {
        msg.innerHTML = "<span style='color:#b3ffb3'>Check your email for the login link.</span>";
      }
    }

    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (!session) return;

      const email = session.user.email;

      // Therapist goes straight to their dashboard
      if (email === THERAPIST_EMAIL) {
        window.location.href = "therapist-dashboard.html";
        return;
      }

      // For patients: check whether they have a payment on record
      // If yes → patient dashboard. If no → onboarding wizard.
      const { data: payments, error } = await supabaseClient
        .from("payments")
        .select("id")
        .eq("patient_id", session.user.id)   // TODO: join via patients.auth_user_id if needed
        .limit(1);

      if (error) {
        console.error("Payment check failed:", error.message);
        // Fail open to onboarding so the patient isn't stuck
        window.location.href = "onboarding.html";
        return;
      }

      if (payments && payments.length > 0) {
        window.location.href = "patient-dashboard.html";
      } else {
        window.location.href = "onboarding.html";
      }
    });
  </script>

</body>
</html>
